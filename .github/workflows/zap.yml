name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main ]
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Start application in background
        # The '&' is crucial—it keeps the app running in the background 
        # so the workflow can move on to the next step.
        run: npm start & 

      # Optional but recommended: Wait for your server to fully boot
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          # Point the scan at the local server running inside the GitHub Action
          target: 'http://localhost:3000'
